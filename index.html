<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xion Bunny | Links</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            --glass: rgba(255, 255, 255, 0.2);
            --text: #2d3436;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text);
            overflow-x: hidden;
        }

        /* ─── Floating Bunny Elements ─── */
        .float-el {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0.12;
            user-select: none;
        }

        .float-el.paw {
            font-size: 3rem;
        }

        .float-el.carrot {
            font-size: 2.2rem;
        }

        .float-el.flower {
            font-size: 1.8rem;
        }

        .float-el.bunny {
            font-size: 2.5rem;
        }

        /* Individual element positions and animations */
        .fe1 { top: 8%; left: 5%; animation: drift1 12s ease-in-out infinite; }
        .fe2 { top: 20%; right: 8%; animation: drift2 15s ease-in-out infinite; }
        .fe3 { top: 45%; left: 3%; animation: drift3 10s ease-in-out infinite; }
        .fe4 { top: 60%; right: 5%; animation: drift1 14s ease-in-out infinite reverse; }
        .fe5 { top: 75%; left: 10%; animation: drift2 11s ease-in-out infinite; }
        .fe6 { top: 35%; right: 12%; animation: drift3 13s ease-in-out infinite reverse; }
        .fe7 { top: 85%; right: 15%; animation: drift1 9s ease-in-out infinite; }
        .fe8 { top: 12%; left: 45%; animation: drift3 16s ease-in-out infinite; }
        .fe9 { top: 92%; left: 40%; animation: drift2 10s ease-in-out infinite reverse; }
        .fe10 { top: 5%; right: 30%; animation: drift1 13s ease-in-out infinite; }

        @keyframes drift1 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(12px, -8px) rotate(5deg); }
            50% { transform: translate(-6px, 10px) rotate(-3deg); }
            75% { transform: translate(8px, 4px) rotate(2deg); }
        }

        @keyframes drift2 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(-10px, 12px) rotate(-4deg); }
            66% { transform: translate(6px, -8px) rotate(3deg); }
        }

        @keyframes drift3 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(15px, -12px) rotate(8deg); }
        }

        /* ─── Main Container ─── */
        .container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 400px;
            text-align: center;
            padding-top: 50px;
            padding-bottom: 50px;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            object-fit: cover;
            background-color: #eee;
            margin-bottom: 15px;
            animation: fadeUp 0.5s ease forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        h1 {
            margin: 10px 0 5px 0;
            font-size: 2rem;
            font-weight: 700;
            color: #4834d4;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.5);
            animation: fadeUp 0.5s ease 0.1s forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        p.subtitle {
            font-style: italic;
            margin-bottom: 30px;
            opacity: 0.8;
            animation: fadeUp 0.5s ease 0.2s forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        .rainbow-line {
            height: 5px;
            width: 60px;
            background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
            margin: 10px auto;
            border-radius: 10px;
            animation: fadeUp 0.5s ease 0.15s forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 15px;
            border-radius: 15px;
            text-decoration: none;
            color: #2d3436;
            font-weight: 600;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            opacity: 0;
            transform: translateY(15px);
            animation: fadeUp 0.4s ease forwards;
        }

        .link-card:nth-child(1) { animation-delay: 0.35s; }
        .link-card:nth-child(2) { animation-delay: 0.45s; }
        .link-card:nth-child(3) { animation-delay: 0.55s; }
        .link-card:nth-child(4) { animation-delay: 0.65s; }
        .link-card:nth-child(5) { animation-delay: 0.75s; }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .link-card i {
            font-size: 1.5rem;
            width: 35px;
            margin-right: 15px;
        }

        .discord i { color: #5865F2; }
        .twitter i { color: #1DA1F2; }
        .bluesky i { color: #0085ff; }
        .telegram i { color: #0088cc; }
        .furaffin i { color: #ff4757; }

        .link-card:hover {
            transform: translateY(-3px) scale(1.02);
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        footer {
            position: relative;
            z-index: 1;
            margin-top: auto;
            padding: 20px;
            font-size: 0.85rem;
            opacity: 0.6;
            animation: fadeUp 0.5s ease 0.9s forwards;
            opacity: 0;
        }
    </style>
</head>
<body>

    <!-- Floating bunny-themed decorations -->
    <span class="float-el paw fe1">🐾</span>
    <span class="float-el carrot fe2">🥕</span>
    <span class="float-el flower fe3">🌸</span>
    <span class="float-el paw fe4">🐾</span>
    <span class="float-el bunny fe5">🐰</span>
    <span class="float-el flower fe6">🌼</span>
    <span class="float-el carrot fe7">🥕</span>
    <span class="float-el paw fe8">🐾</span>
    <span class="float-el flower fe9">🌸</span>
    <span class="float-el bunny fe10">🐰</span>

    <div class="container">
        <img src="sketch2.png" alt="Xion Bunny" class="profile-pic">

        <h1>Xion Bunny</h1>
        <div class="rainbow-line"></div>
        <p class="subtitle">Welcome to my burrow!</p>

        <div class="links-container">
            <a href="https://discord.com/users/641416678122586143" class="link-card discord">
                <i class="fab fa-discord"></i> Discord (XionBunny)
            </a>

            <a href="https://twitter.com/xionbunny" class="link-card twitter" target="_blank">
                <i class="fab fa-twitter"></i> Twitter (@xionbunny)
            </a>

            <a href="https://bsky.app/profile/xionbunny.bsky.social" class="link-card bluesky" target="_blank">
                <i class="fas fa-cloud"></i> BlueSky (xionbunny)
            </a>

            <a href="https://t.me/xionbunny" class="link-card telegram" target="_blank">
                <i class="fab fa-telegram-plane"></i> Telegram (xionbunny)
            </a>

            <a href="https://www.furaffinity.net/user/xionwolf" class="link-card furaffin" target="_blank">
                <i class="fas fa-palette"></i> FurAffinity (xionwolf)
            </a>
        </div>
    </div>

    <footer>
        &copy; Xion Bunny &bull; Made with ❤️
    </footer>

</body>
</html>
