<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xion Bunny | Links</title>
    <!-- High-Performance CDN for Official Brand Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            --glass: rgba(255, 255, 255, 0.2);
            --text: #2d3436;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text);
        }

        /* Decorative Bunny Ear Background Element */
        body::before {
            content: '🐰';
            position: fixed;
            top: -50px;
            right: -50px;
            font-size: 20rem;
            opacity: 0.1;
            z-index: -1;
        }

        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            padding-top: 40px;
            padding-bottom: 40px;
        }

        .profile-pic {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            object-fit: cover;
            margin-bottom: 15px;
        }

        h1 {
            margin: 10px 0 5px 0;
            font-size: 2rem;
            color: #4834d4;
            text-shadow: 1px 1px 2px white;
        }

        .rainbow-line {
            height: 6px;
            width: 80px;
            background: linear-gradient(to right, #ff4757, #ffa502, #eccc68, #2ed573, #1e90ff, #a29bfe, #ff4757);
            margin: 10px auto 25px auto;
            border-radius: 10px;
        }

        p.subtitle {
            font-style: italic;
            margin-bottom: 30px;
            font-weight: 500;
            opacity: 0.8;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Professional Link Card Styling */
        .link-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 16px;
            border-radius: 18px;
            text-decoration: none;
            color: #2d3436;
            font-weight: 600;
            display: flex;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .link-card i {
            font-size: 1.6rem;
            width: 40px;
            margin-right: 10px;
            text-align: center;
        }

        /* Official Brand Colors for Icons */
        .discord i { color: #5865F2; }
        .twitter i { color: #1DA1F2; }
        .bluesky i { color: #0085ff; }
        .telegram i { color: #0088cc; }
        .steam i { color: #171a21; }
        .furaffin i { color: #ff4757; }

        .link-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.45);
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
        }

        footer {
            margin-top: auto;
            padding: 30px;
            font-size: 0.85rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Default profile picture set to sketch2.png -->
        <img src="sketch2.png" alt="Xion Bunny" class="profile-pic">
        
        <h1>Xion Bunny</h1>
        <div class="rainbow-line"></div>
        <p class="subtitle">Welcome to my burrow!</p>

        <div class="links-container">
            <!-- Discord -->
            <a href="https://discord.com/users/641416678122586143" class="link-card discord" target="_blank">
                <i class="fab fa-discord"></i> Discord (XionBunny)
            </a>

            <!-- Twitter/X -->
            <a href="https://twitter.com/xionbunny" class="link-card twitter" target="_blank">
                <i class="fab fa-x-twitter"></i> Twitter (@xionbunny)
            </a>

            <!-- BlueSky -->
            <a href="https://bsky.app/profile/xionbunny.bsky.social" class="link-card bluesky" target="_blank">
                <i class="fas fa-cloud"></i> BlueSky (xionbunny)
            </a>

            <!-- Telegram -->
            <a href="https://t.me/xionbunny" class="link-card telegram" target="_blank">
                <i class="fab fa-telegram-plane"></i> Telegram (xionbunny)
            </a>

            <!-- Steam -->
            <a href="https://steamcommunity.com/id/xionbunny" class="link-card steam" target="_blank">
                <i class="fab fa-steam"></i> Steam (xionbunny)
            </a>

            <!-- FurAffinity -->
            <a href="https://www.furaffinity.net/user/xionwolf" class="link-card furaffin" target="_blank">
                <i class="fas fa-palette"></i> FurAffinity (xionwolf)
            </a>
        </div>
    </div>

    <footer>
        &copy; Xion Bunny • Made with ❤️
    </footer>

</body>
</html>
