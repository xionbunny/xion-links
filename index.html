<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xion Bunny | Links</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            --accent-blue: #3f51b5; /* Bandana blue */
            --glass: rgba(255, 255, 255, 0.2);
            --text: #2d3436;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text);
        }

        /* Decorative Bunny Ears Background Element */
        body::before {
            content: '🐰';
            position: fixed;
            top: -50px;
            right: -50px;
            font-size: 20rem;
            opacity: 0.1;
            z-index: -1;
        }

        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            padding-top: 50px;
            padding-bottom: 50px;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            object-fit: cover;
            background-color: #eee;
            margin-bottom: 15px;
        }

        h1 {
            margin: 10px 0 5px 0;
            font-size: 2rem;
            color: #4834d4;
            text-shadow: 1px 1px 0px white;
        }

        p.subtitle {
            font-style: italic;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 15px;
            border-radius: 15px;
            text-decoration: none;
            color: #2d3436;
            font-weight: 600;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .link-card i {
            font-size: 1.5rem;
            width: 35px;
            margin-right: 15px;
        }

        /* Brand Colors */
        .discord i { color: #5865F2; }
        .twitter i { color: #1DA1F2; }
        .bluesky i { color: #0085ff; }
        .telegram i { color: #0088cc; }
        .furaffin i { color: #ff4757; }

        .link-card:hover {
            transform: translateY(-3px) scale(1.02);
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        footer {
            margin-top: auto;
            padding: 20px;
            font-size: 0.8rem;
            opacity: 0.6;
        }

        /* Rainbow accent line for Xion */
        .rainbow-line {
            height: 5px;
            width: 60px;
            background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
            margin: 10px auto;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Replace 'your-image-url.jpg' with a link to your character art -->
        <img src="https://github.com/xionbunny/xion-links/blob/main/sketch2.png" alt="Xion Bunny" class="profile-pic">
        
        <h1>Xion Bunny</h1>
        <div class="rainbow-line"></div>
        <p class="subtitle">Welcome to my burrow!</p>

        <div class="links-container">
            <!-- Discord -->
            <a href="https://discord.com/users/YOUR_DISCORD_ID" class="link-card discord">
                <i class="fab fa-discord"></i> Discord (XionBunny)
            </a>

            <!-- Twitter -->
            <a href="https://twitter.com/xionbunny" class="link-card twitter" target="_blank">
                <i class="fab fa-twitter"></i> Twitter (@xionbunny)
            </a>

            <!-- Bluesky -->
            <a href="https://bsky.app/profile/xionbunny.bsky.social" class="link-card bluesky" target="_blank">
                <i class="fas fa-cloud"></i> BlueSky (xionbunny)
            </a>

            <!-- Telegram -->
            <a href="https://t.me/xionbunny" class="link-card telegram" target="_blank">
                <i class="fab fa-telegram-plane"></i> Telegram (xionbunny)
            </a>

            <!-- FurAffinity -->
            <a href="https://www.furaffinity.net/user/xionwolf" class="link-card furaffin" target="_blank">
                <i class="fas fa-palette"></i> FurAffinity (xionwolf)
            </a>
        </div>
    </div>

    <footer>
        &copy; Xion Bunny • Made with ❤️
    </footer>

</body>
</html>
